plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'bot'
version = '2.7.0'
java {
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

compileJava.options.encoding = 'UTF-8'

application {
    mainClass = 'bot.MusicBot'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.lavalink.dev/releases' }
    maven {
        url 'https://maven.lavalink.dev/snapshots'
        content { includeGroup 'dev.lavalink.youtube' }
    }
}

dependencies {
    implementation 'net.dv8tion:JDA:6.4.2'
    implementation 'dev.arbjerg:lavaplayer:2.2.7'
    implementation 'dev.lavalink.youtube:v2:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3-SNAPSHOT'
    implementation 'ch.qos.logback:logback-classic:1.5.36'
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'org.slf4j:slf4j-api:2.0.16'

    // DAVE E2EE protocol support (required for Discord voice)
    implementation 'club.minnced:jdave-api:0.1.8'
    implementation 'club.minnced:jdave-native-win-x86-64:0.1.8'
    implementation 'club.minnced:jdave-native-linux-x86-64:0.1.8'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes 'Main-Class': 'bot.MusicBot'
    }
}

processResources {
    filesMatching("version.properties") {
        expand(version: version)
    }
}

test {
    useJUnitPlatform()
}
