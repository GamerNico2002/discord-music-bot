help.queue.body=`/queue` \u2014 Mostrar cola\n`/playing` \u2014 Canci\u00f3n actual con controles\n`/seek <tiempo>` \u2014 Saltar en la canci\u00f3n (ej. 1:30)\n`/skipto <posici\u00f3n>` \u2014 Saltar a canci\u00f3n en cola\n`/move <de> <a>` \u2014 Mover canci\u00f3n\n`/repeat <off/track/queue>` \u2014 Modo repetir\n`/shuffle` \u2014 Mezclar cola\n`/remove <posici\u00f3n>` \u2014 Quitar de la cola\n`/clear` \u2014 Vaciar cola\n`/save` \u2014 Guardar canci\u00f3n por MD
