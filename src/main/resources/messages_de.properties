help.title=\uD83C\uDFB5 Music Bot \u2014 Hilfe
help.music.title=\uD83C\uDFA7 Musik
help.music.body=`/play <URL/Suche>` \u2014 Song, Playlist oder Radio\n`/skip` \u2014 Song ueberspringen\n`/stop` \u2014 Musik stoppen & Queue leeren\n`/pause` \u2014 Pausieren\n`/resume` \u2014 Fortsetzen\n`/volume <0-100>` \u2014 Lautstaerke aendern\n`/radio <sender>` \u2014 Live-Radio hoeren
help.queue.title=\uD83D\uDCCB Queue & Wiedergabe
help.queue.body=`/queue` \u2014 Warteschlange anzeigen\n`/playing` \u2014 Aktueller Song mit Steuerung\n`/seek <Zeit>` \u2014 Im Song springen (z.B. 1:30)\n`/skipto <Position>` \u2014 Zu Song in Queue springen\n`/move <von> <nach>` \u2014 Song verschieben\n`/repeat <off/track/queue>` \u2014 Repeat-Modus\n`/shuffle` \u2014 Queue mischen\n`/remove <Position>` \u2014 Song aus Queue entfernen\n`/clear` \u2014 Queue leeren\n`/save` \u2014 Song per DM speichern
help.voice.title=\uD83D\uDD0A Voice & Audio
help.voice.body=`/join` \u2014 Voice-Channel beitreten\n`/leave` \u2014 Voice-Channel verlassen\n`/filter <preset>` \u2014 Audio-Filter (Bassboost, etc.)\n`/nonstop` \u2014 Nonstop-Modus: random Tekk/Techno/Uptempo
