help.music.title=\uD83C\uDFA7 Musique
help.music.body=`/play <URL/recherche>` \u2014 Morceau, playlist ou radio\n`/skip` \u2014 Passer le morceau\n`/stop` \u2014 Arr\u00eater & vider la file\n`/pause` \u2014 Mettre en pause\n`/resume` \u2014 Reprendre\n`/volume <0-100>` \u2014 Changer le volume\n`/radio <station>` \u2014 \u00c9couter la radio en direct
help.queue.title=\uD83D\uDCCB File & lecture
help.queue.body=`/queue` \u2014 Afficher la file\n`/playing` \u2014 Morceau actuel avec contr\u00f4les\n`/seek <temps>` \u2014 Sauter dans le morceau (ex. 1:30)\n`/skipto <position>` \u2014 Sauter \u00e0 un morceau\n`/move <de> <\u00e0>` \u2014 D\u00e9placer un morceau\n`/repeat <off/track/queue>` \u2014 Mode r\u00e9p\u00e9tition\n`/shuffle` \u2014 M\u00e9langer la file\n`/remove <position>` \u2014 Retirer de la file\n`/clear` \u2014 Vider la file\n`/save` \u2014 Sauvegarder en MP
help.voice.title=\uD83D\uDD0A Voix & audio
help.voice.body=`/join` \u2014 Rejoindre le salon vocal\n`/leave` \u2014 Quitter le salon vocal\n`/filter <preset>` \u2014 Filtre audio (bassboost, etc.)\n`/nonstop` \u2014 Mode Nonstop : Tekk/Techno/Uptempo al\u00e9atoires
