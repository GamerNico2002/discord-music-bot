help.title=\uD83C\uDFB5 Music Bot \u2014 Help
help.music.title=\uD83C\uDFA7 Music
help.music.body=`/play <URL/search>` \u2014 Song, playlist or radio\n`/skip` \u2014 Skip song\n`/stop` \u2014 Stop music & clear queue\n`/pause` \u2014 Pause\n`/resume` \u2014 Resume\n`/volume <0-100>` \u2014 Change volume\n`/radio <station>` \u2014 Listen to live radio
help.queue.title=\uD83D\uDCCB Queue & Playback
help.queue.body=`/queue` \u2014 Show queue\n`/playing` \u2014 Current song with controls\n`/seek <time>` \u2014 Jump within song (e.g. 1:30)\n`/skipto <position>` \u2014 Jump to song in queue\n`/move <from> <to>` \u2014 Move song\n`/repeat <off/track/queue>` \u2014 Repeat mode\n`/shuffle` \u2014 Shuffle queue\n`/remove <position>` \u2014 Remove song from queue\n`/clear` \u2014 Clear queue\n`/save` \u2014 Save song via DM
help.voice.title=\uD83D\uDD0A Voice & Audio
help.voice.body=`/join` \u2014 Join voice channel\n`/leave` \u2014 Leave voice channel\n`/filter <preset>` \u2014 Audio filter (bassboost, etc.)\n`/nonstop` \u2014 Nonstop mode: random Tekk/Techno/Uptempo
help.other.title=\u2139\uFE0F Other
help.other.body=`/invite` \u2014 Invite bot\n`/info` \u2014 Bot info\n`/uptime` \u2014 Online time\n`/language` \u2014 Change language\n`/playlist` \u2014 Create / manage playlists\n`/help` \u2014 This help
